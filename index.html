<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1e7d0" />
    <meta name="description" content="A campaign-led Sudoku adventure from Rokumon Games." />
    <title>Rokumon Sudoku</title>
